<title>Counter Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---------- tokens ----------
     Brand palette pulled from Rugs Creation's own build (index.html):
     violet/pink accent, near-black ink shell, lavender-white paper cards,
     and the exact seal-tag colors (Green #3F6B52 / Red #9B3B3B / White) from
     that file's SEAL_TYPES constant. Status hues re-picked from the same
     family and run through the CVD-safety validator for both themes. */
  :root{
    --bg:#F4F3FB; --surface:#FFFFFF; --surface-2:#ECE9F9;
    --border:#E4E1F5; --border-strong:#CFC9EC;
    --ink:#14121F; --ink-2:#46415F; --ink-muted:#69648A;
    --accent:#7C5CFC; --accent-ink:#FFFFFF; --accent-soft:#EEE9FE; --accent-soft-ink:#5A3FD1;
    --accent-2:#FF5C8D;
    --good:#0E8F6C; --good-soft:#DFF5EC; --good-ink:#0B6E54;
    --warn:#B8790A; --warn-soft:#FBF0DA; --warn-ink:#8A5C0E;
    --critical:#C93347; --critical-soft:#FBE6EA; --critical-ink:#96212F;
    --seal-green:#3F6B52; --seal-red:#9B3B3B; --seal-white:#F7F6F2;
    --toast-bg:#1C1A2E; --toast-ink:#F5F5F2;
    --shadow: 0 1px 2px rgba(20,18,31,.06), 0 10px 26px -14px rgba(20,18,31,.2);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0B14; --surface:#16162A; --surface-2:#1E1D38;
      --border:#2A2846; --border-strong:#3A375C;
      --ink:#F5F4FB; --ink-2:#D5D2EC; --ink-muted:#B7B3D6;
      --accent:#8F73FF; --accent-ink:#0B0B14; --accent-soft:#241F45; --accent-soft-ink:#C6B8FF;
      --accent-2:#FF5C8D;
      --good:#1E9E77; --good-soft:#132C24; --good-ink:#5FD3AC;
      --warn:#9E7A0C; --warn-soft:#2E2712; --warn-ink:#D8B44A;
      --critical:#EF4C5D; --critical-soft:#3A1620; --critical-ink:#FF8B99;
      --seal-green:#5FA483; --seal-red:#D46A6A; --seal-white:#F4F4F1;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0B14; --surface:#16162A; --surface-2:#1E1D38;
    --border:#2A2846; --border-strong:#3A375C;
    --ink:#F5F4FB; --ink-2:#D5D2EC; --ink-muted:#B7B3D6;
    --accent:#8F73FF; --accent-ink:#0B0B14; --accent-soft:#241F45; --accent-soft-ink:#C6B8FF;
    --accent-2:#FF5C8D;
    --good:#1E9E77; --good-soft:#132C24; --good-ink:#5FD3AC;
    --warn:#9E7A0C; --warn-soft:#2E2712; --warn-ink:#D8B44A;
    --critical:#EF4C5D; --critical-soft:#3A1620; --critical-ink:#FF8B99;
    --seal-green:#5FA483; --seal-red:#D46A6A; --seal-white:#F4F4F1;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
  }

  /* Everything below avoids flexbox `gap` on purpose — Safari on iOS 12
     (the actual device this runs on, per spec) never got flex-gap support
     (that landed in Safari 14.1). Spacing uses margins on `> * + *` siblings
     instead, which has worked in every WebKit since iOS 6. Grid `gap` (used
     only for the stat tiles / two-column form rows) is fine — grid-gap
     shipped in Safari 10.1. */
  *{box-sizing:border-box; -webkit-tap-highlight-color:rgba(0,0,0,0);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; font-family:"Archivo Expanded", "Archivo", ui-sans-serif, sans-serif;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font:inherit; cursor:pointer; touch-action:manipulation;}
  input,select,textarea{font:inherit;}
  ::selection{background:var(--accent-soft); color:var(--accent-soft-ink);}

  .app{max-width:900px; margin:0 auto; padding:12px 14px 90px;}

  /* generic horizontal stack (flex, no gap) */
  .hstack{display:flex; align-items:center;}
  .hstack > * + *{margin-left:8px;}
  .hstack.wrap{flex-wrap:wrap;}
  .hstack.wrap > *{margin-bottom:8px;}
  .hstack.between{justify-content:space-between;}
  .hstack.tight > * + *{margin-left:6px;}

  /* ---------- login ---------- */
  .login-overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:20px; overflow-y:auto;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); padding:30px 26px; margin:20px 0;
  }
  .login-mark{
    display:flex; align-items:center; justify-content:center;
    background:#0B0B14; border-radius:10px; padding:10px 16px; margin:0 auto 18px; width:max-content;
  }
  .login-mark img{height:30px; width:auto; display:block;}
  .login-card h1{font-size:19px; text-align:center;}
  .login-sub{text-align:center; color:var(--ink-muted); font-size:12.5px; margin-top:5px;}
  .login-field{margin-top:14px;}
  .login-field label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin-bottom:5px;
  }
  .login-field input{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); font-size:16px; min-height:46px;
  }
  .login-field input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .login-error{font-size:12.5px; color:var(--critical-ink); min-height:16px; margin-top:10px;}
  .login-submit{
    width:100%; margin-top:8px; padding:13px; border-radius:8px; border:0; background:var(--accent);
    color:var(--accent-ink); font-weight:700; font-size:14px; min-height:48px;
  }
  .login-hint{
    margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:11.5px;
    color:var(--ink-muted); line-height:1.7;
  }
  .login-hint b{color:var(--ink-2); font-family:"IBM Plex Mono"; font-weight:600;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    padding:10px 2px 12px; border-bottom:1px solid var(--border); margin-bottom:12px;
  }
  .brand{display:flex; align-items:center;}
  .brand > * + *{margin-left:10px;}
  .brand-mark{
    display:flex; align-items:center; justify-content:center;
    background:#0B0B14; border-radius:8px; padding:6px 9px; flex:none;
  }
  .brand-mark img{height:22px; width:auto; display:block;}
  .brand-text h1{font-size:17px; font-weight:800; letter-spacing:.01em;}
  .brand-sub{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.08em;}

  .topbar-right{display:flex; align-items:center; flex-wrap:wrap; margin-top:8px;}
  .topbar-right > * + *{margin-left:8px;}
  @media (min-width:640px){ .topbar-right{margin-top:0;} }

  .live-indicator{
    display:flex; align-items:center; font-size:12px; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--border); padding:6px 10px; border-radius:999px;
  }
  .live-indicator > * + *{margin-left:6px;}
  .pulse-dot{width:7px; height:7px; border-radius:50%; background:var(--good); position:relative; flex:none;}
  .pulse-dot::after{
    content:""; position:absolute; top:-5px; left:-5px; right:-5px; bottom:-5px; border-radius:50%;
    border:1.5px solid var(--good); animation:pulse 2.2s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .pulse-dot::after{animation:none; opacity:.4;} }
  @keyframes pulse{ 0%{transform:scale(.5); opacity:.9;} 100%{transform:scale(1.6); opacity:0;} }
  .clock{font-family:"IBM Plex Mono"; font-size:12px; color:var(--ink-2); display:none;}
  @media (min-width:640px){ .clock{display:inline;} }

  .user-chip{display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 12px 4px 4px;}
  .user-chip > * + *{margin-left:8px;}
  .user-chip .avatar{width:24px; height:24px; font-size:9.5px;}
  .user-chip .u-name{font-size:12px; font-weight:700; line-height:1.2;}
  .user-chip .u-role{font-size:9.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; line-height:1.2;}
  .logout-btn{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); padding:9px 12px; border-radius:8px; font-size:12px; font-weight:600; min-height:38px;}

  /* ---------- top nav (tablet landscape / desktop) ---------- */
  .nav-tabs{display:none; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:5px; margin-bottom:14px;}
  .nav-tabs .hstack{display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}
  .nav-tab{border:0; background:transparent; color:var(--ink-2); padding:10px 8px; border-radius:8px; font-size:12.5px; font-weight:700; min-height:40px;}
  .nav-tab.active{background:var(--accent); color:var(--accent-ink);}
  @media (min-width:760px){ .nav-tabs{display:block;} }

  /* ---------- bottom nav (phone / tablet portrait) ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:var(--surface); border-top:1px solid var(--border);
    padding:6px 2px calc(6px + env(safe-area-inset-bottom)) 2px;
  }
  @media (min-width:760px){ .bottom-nav{display:none;} }
  .bn-item{border:0; background:transparent; color:var(--ink-muted); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 2px; border-radius:10px; font-size:9.5px; font-weight:700; min-height:48px;}
  .bn-item .bn-icon{font-size:18px; line-height:1; margin-bottom:3px;}
  .bn-item.active{color:var(--accent);}

  /* ---------- panels / cards shell ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
  .panel:last-child{margin-bottom:0;}
  .panel-head{margin-bottom:12px;}
  .panel-head h2{font-size:15px;}
  .panel-head .hint{font-size:12px; color:var(--ink-muted); font-weight:500; margin-top:2px; display:block;}
  .view-title{margin-bottom:14px;}
  .view-title h1{font-size:19px;}
  .view-title p{font-size:12.5px; color:var(--ink-muted); margin-top:3px;}

  /* ---------- stat tiles (clickable) ---------- */
  .stats-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
  @media (min-width:560px){ .stats-row{grid-template-columns:repeat(4,1fr);} }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow); text-align:left; width:100%; min-height:96px;
  }
  .stat-tile:active{background:var(--surface-2);}
  .stat-tile .stat-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:9px;}
  .stat-tile.total .stat-icon{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .stat-tile.room .stat-icon{background:var(--good-soft); color:var(--good-ink);}
  .stat-tile.issued .stat-icon{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .stat-tile.overdue .stat-icon{background:var(--critical-soft); color:var(--critical-ink);}
  .stat-value{font-family:"Archivo Expanded"; font-weight:800; font-size:24px; line-height:1;}
  .stat-label{font-size:11.5px; color:var(--ink-2); margin-top:4px; font-weight:600;}
  .stat-sub{font-size:11px; color:var(--ink-muted); margin-top:5px;}
  .stat-sub.flag{color:var(--critical-ink); font-weight:600;}

  /* ---------- composition ---------- */
  .comp-bar{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-2); border:1px solid var(--border);}
  .comp-seg{height:100%;}
  .comp-seg.room{background:var(--good);}
  .comp-seg.issued{background:var(--accent);}
  .comp-seg.overdue{background:var(--critical);}
  .comp-legend{display:flex; flex-wrap:wrap; margin-top:10px;}
  .comp-legend > *{margin-right:16px; margin-top:4px;}
  .comp-legend-item{display:inline-flex; align-items:center; font-size:12px; color:var(--ink-2);}
  .comp-legend-item > * + *{margin-left:6px;}
  .comp-dot{width:8px; height:8px; border-radius:2px; flex:none;}
  .comp-dot.room{background:var(--good);} .comp-dot.issued{background:var(--accent);} .comp-dot.overdue{background:var(--critical);}
  .comp-legend-item b{color:var(--ink); font-family:"IBM Plex Mono"; font-weight:600;}
  .as-of{font-size:11px; color:var(--ink-muted); margin-top:2px; display:block;}

  /* ---------- attention banner ---------- */
  .attn-banner{border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; border:1px solid var(--border); width:100%; text-align:left;}
  .attn-banner.ok{background:var(--good-soft); border-color:transparent;}
  .attn-banner.warn{background:var(--critical-soft); border-color:transparent;}
  .attn-banner .attn-title{font-weight:700; font-size:13px;}
  .attn-banner.ok .attn-title{color:var(--good-ink);}
  .attn-banner.warn .attn-title{color:var(--critical-ink);}
  .attn-banner .attn-sub{font-size:11.5px; color:var(--ink-2); margin-top:3px;}

  /* ---------- activity feed ---------- */
  .activity-item{display:flex; padding:9px 0; border-bottom:1px solid var(--border);}
  .activity-item > * + *{margin-left:10px;}
  .activity-item:last-child{border-bottom:0; padding-bottom:0;}
  .activity-icon{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;}
  .activity-icon.logged{background:var(--surface-2); color:var(--ink-2);}
  .activity-icon.issued{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .activity-icon.returned{background:var(--good-soft); color:var(--good-ink);}
  .activity-text{font-size:12.5px; color:var(--ink);}
  .activity-text b{font-weight:600;}
  .activity-time{font-size:11px; color:var(--ink-muted); margin-top:2px;}
  .reset-link{background:none; border:0; color:var(--ink-muted); text-decoration:underline; font-size:11.5px; cursor:pointer; padding:0; margin-top:14px;}

  /* ---------- search / filter ---------- */
  .search-box{display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--ink-2); margin-bottom:10px;}
  .search-box > * + *{margin-left:8px;}
  .search-box svg{flex:none; opacity:.7;}
  .search-box input{border:0; background:transparent; outline:0; color:var(--ink); width:100%; font-size:16px;}
  .search-box input::placeholder{color:var(--ink-muted);}
  .filter-chips{display:flex; flex-wrap:wrap; margin-bottom:12px;}
  .filter-chips > *{margin-right:6px; margin-bottom:6px;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); padding:8px 13px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; min-height:36px;}
  .chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .empty-note{color:var(--ink-muted); font-size:12.5px; padding:16px 2px; text-align:center;}

  /* ---------- sample cards ---------- */
  .seal-chip{width:20px; height:20px; border-radius:50%; flex:none; border:2px solid var(--border-strong);}
  .seal-chip.sm{width:12px; height:12px; border-width:2px;}
  .seal-chip.c-green{background:var(--seal-green); border-color:var(--seal-green);}
  .seal-chip.c-red{background:var(--seal-red); border-color:var(--seal-red);}
  .seal-chip.c-white{background:var(--seal-white);}
  .avatar{width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-soft-ink); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex:none; object-fit:cover; overflow:hidden;}
  img.avatar{border:2px solid var(--border-strong);}
  .type-chip{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:5px; background:var(--surface); color:var(--ink-2); white-space:nowrap; border:1px solid var(--border);}
  .status-pill{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .status-pill > * + *{margin-left:5px;}
  .status-pill::before{content:""; width:6px; height:6px; border-radius:50%; flex:none;}
  .status-pill.room{background:var(--good-soft); color:var(--good-ink);}
  .status-pill.room::before{background:var(--good);}
  .status-pill.issued{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .status-pill.issued::before{background:var(--accent);}
  .status-pill.overdue{background:var(--critical-soft); color:var(--critical-ink);}
  .status-pill.overdue::before{background:var(--critical);}
  .due-badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; font-family:"IBM Plex Mono";}
  .due-badge.critical{background:var(--critical-soft); color:var(--critical-ink);}
  .due-badge.warn{background:var(--warn-soft); color:var(--warn-ink);}
  .due-badge.ok{background:var(--good-soft); color:var(--good-ink);}

  .s-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .s-card:last-child{margin-bottom:0;}
  .s-card.sev-critical{border-left:4px solid var(--critical);}
  .s-card.sev-warn{border-left:4px solid var(--warn);}
  .s-card-main{display:flex; align-items:center; width:100%; padding:12px; background:transparent; border:0; text-align:left; min-height:64px;}
  .s-card-main > * + *{margin-left:10px;}
  .s-card-main:active{background:var(--surface-2);}
  .s-thumb{width:42px; height:42px; border-radius:8px; flex:none; background:var(--surface-2); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); overflow:hidden; font-size:16px;}
  .s-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .s-card-body{flex:1; min-width:0;}
  .s-card-top{display:flex; align-items:center; flex-wrap:wrap;}
  .s-card-top > *{margin-right:8px; margin-top:2px;}
  .s-card-name{display:block; font-size:13.5px; font-weight:600; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .s-card-meta{display:block; font-size:11.5px; color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .s-card-holder{display:flex; align-items:center; margin-top:5px;}
  .s-card-holder > * + *{margin-left:6px;}
  .s-card-holder .name{font-size:11.5px; color:var(--ink-2); font-weight:600;}
  .s-card-holder .dept{font-size:10.5px; color:var(--ink-muted);}
  .s-chevron{color:var(--ink-muted); flex:none; transition:transform .15s ease; font-size:13px;}
  .s-card.expanded .s-chevron{transform:rotate(180deg);}
  .s-card-detail{display:none; border-top:1px solid var(--border); padding:14px; background:var(--surface-2);}
  .s-card.expanded .s-card-detail{display:block;}

  .detail-row{display:flex; padding:6px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .detail-row:last-child{border-bottom:0;}
  .detail-row .k{width:96px; flex:none; color:var(--ink-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
  .detail-row .v{color:var(--ink); word-break:break-word;}
  .s-thumb{cursor:zoom-in;}
  /* ---------- multi-photo strip (sample photos, shown wherever a sample's
     photos are managed — the master-data card detail and the edit form
     share this) ---------- */
  .photo-strip{display:flex; flex-wrap:wrap; margin:2px 0 4px;}
  .photo-strip > *{margin-right:8px; margin-bottom:8px;}
  .photo-strip-item{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border-strong); flex:none; display:block; padding:0; background:var(--surface); cursor:zoom-in;}
  .photo-strip-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-strip-remove{position:absolute; top:2px; right:2px; width:20px; height:20px; min-height:auto; border-radius:50%; border:0; background:rgba(20,18,31,.65); color:#fff; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .photo-strip-remove:hover{background:rgba(20,18,31,.85);}
  .photo-strip-add{width:64px; height:64px; border-radius:8px; border:1px dashed var(--border-strong); background:var(--surface); color:var(--ink-muted); font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; min-height:auto; padding:0;}
  .photo-strip-empty-note{font-size:12px; color:var(--ink-muted); margin-bottom:8px;}

  .photo-lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:200; padding:24px;}
  .photo-lightbox.open{display:flex;}
  .photo-lightbox img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5); object-fit:contain;}
  .photo-lightbox-close{position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .photo-lightbox-close:hover{background:rgba(255,255,255,.28);}
  .photo-lightbox-nav{position:fixed; top:50%; margin-top:-22px; width:44px; height:44px; min-height:auto; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; padding:0;}
  .photo-lightbox-nav:hover{background:rgba(255,255,255,.28);}
  .photo-lightbox-nav.prev{left:12px;}
  .photo-lightbox-nav.next{right:12px;}
  .photo-lightbox-counter{position:fixed; bottom:20px; left:50%; -webkit-transform:translateX(-50%); transform:translateX(-50%); color:#fff; font-size:12.5px; font-weight:600; background:rgba(0,0,0,.55); padding:5px 12px; border-radius:999px;}
  @media (max-width:520px){ .photo-lightbox-nav{width:38px; height:38px; font-size:19px;} .photo-lightbox-nav.prev{left:6px;} .photo-lightbox-nav.next{right:6px;} }
  .detail-actions{display:flex; flex-wrap:wrap; margin-top:12px;}
  .detail-actions > *{margin-right:8px; margin-top:8px;}

  .act-btn{border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:9px 14px; font-size:12px; font-weight:700; color:var(--ink-2); white-space:nowrap; min-height:38px;}
  .act-btn.issue{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .act-btn.return{background:var(--good); color:#fff; border-color:transparent;}
  .act-btn.edit{background:var(--surface); color:var(--ink-2);}
  .act-btn.delete{color:var(--critical-ink); border-color:var(--critical-soft);}
  .act-btn.small{padding:6px 10px; font-size:11px; min-height:32px;}

  .hist-item{display:flex; padding:7px 0; border-bottom:1px solid var(--border); font-size:12px;}
  .hist-item > * + *{margin-left:9px;}
  .hist-item:last-child{border-bottom:0;}
  .hist-dot{width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .hist-dot.logged{background:var(--surface); color:var(--ink-2);}
  .hist-dot.issued{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .hist-dot.returned{background:var(--good-soft); color:var(--good-ink);}
  .hist-time{font-size:10.5px; color:var(--ink-muted); margin-top:1px;}
  .section-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin:14px 0 8px;}
  .section-label:first-child{margin-top:0;}

  /* ---------- inline forms (log / issue / edit) ---------- */
  .im-field{margin-top:12px;}
  .im-field:first-child{margin-top:0;}
  .im-field label{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:6px;}
  .im-field input, .im-field select, .im-field textarea{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:16px; min-height:46px;
  }
  .im-field textarea{resize:vertical; min-height:64px; font-size:15px;}
  .im-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .im-grid2 .im-field{margin-top:0;}
  .deadline-row{display:flex; flex-wrap:wrap; margin-top:8px;}
  .deadline-row > *{margin-right:6px; margin-bottom:6px;}
  .deadline-chip{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); padding:8px 12px; border-radius:999px; font-size:12px; font-weight:600; min-height:36px;}
  .deadline-chip.selected{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .taker-photo-row{display:flex; align-items:center; margin-top:6px;}
  .taker-photo-row > * + *{margin-left:12px;}
  .taker-photo-preview{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--border-strong); flex:none;}
  .taker-photo-empty{width:52px; height:52px; border-radius:50%; background:var(--surface); border:1px dashed var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); flex:none; font-size:18px;}
  .photo-pick-btn{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); padding:9px 13px; border-radius:8px; font-size:12.5px; font-weight:600; min-height:40px;}
  .im-policy{font-size:11.5px; color:var(--critical-ink); margin-top:12px; line-height:1.5;}
  .im-actions{display:flex; flex-wrap:wrap; margin-top:16px;}
  .im-actions > *{margin-right:8px; margin-top:8px;}
  /* On phones the bottom-nav is fixed over the content, so any action row
     (Save/Cancel/Delete etc.) that lands at the end of a scrolling list —
     like the master-data edit form — can end up tucked behind it and be
     unreachable. Reserve enough space below these rows to clear the nav. */
  @media (max-width:759px){ .im-actions{margin-bottom:calc(76px + env(safe-area-inset-bottom));} }
  .im-confirm{padding:13px 18px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:13.5px; min-height:46px;}
  .im-confirm:disabled{opacity:.55;}
  .im-cancel{padding:13px 18px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); font-weight:600; font-size:13.5px; min-height:46px;}

  /* ---------- log sample view (dedicated screen) ---------- */
  .log-photo-row{display:flex; align-items:center; margin-bottom:16px;}
  .log-photo-row > * + *{margin-left:14px;}
  .log-photo-preview{width:72px; height:72px; border-radius:10px; object-fit:cover; border:2px solid var(--border-strong); flex:none;}
  .log-photo-empty{width:72px; height:72px; border-radius:10px; background:var(--surface-2); border:1px dashed var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); font-size:24px; flex:none;}

  /* ---------- toast ---------- */
  #toastRoot{position:fixed; left:0; right:0; bottom:70px; display:flex; flex-direction:column; align-items:center; z-index:95; pointer-events:none; padding:0 16px;}
  #toastRoot > * + *{margin-top:8px;}
  @media (min-width:760px){ #toastRoot{bottom:18px;} }
  .toast{
    pointer-events:auto; max-width:400px; width:100%; background:var(--toast-bg); color:var(--toast-ink);
    padding:12px 15px; border-radius:10px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow);
    border-left:4px solid var(--accent); opacity:0; -webkit-transform:translateY(8px); transform:translateY(8px);
    transition:opacity .2s ease, -webkit-transform .2s ease; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; -webkit-transform:translateY(0); transform:translateY(0);}
  .toast.error{border-left-color:var(--critical);}
  .toast.success{border-left-color:var(--good);}

  /* label popover (print label) */
  #labelPopover{position:fixed; z-index:80; width:212px; background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; box-shadow:var(--shadow); padding:14px; display:none;}
  #labelPopover.open{display:block;}
  .label-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .label-seal{font-family:"IBM Plex Mono"; font-weight:600; font-size:13px;}
  .label-type{font-size:10.5px; color:var(--ink-muted); margin-top:2px;}
  .label-close{border:0; background:transparent; color:var(--ink-muted); padding:4px; min-height:auto;}
  .qr-grid{width:120px; height:120px; margin:0 auto 10px; display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); background:#fff; padding:6px; border-radius:4px; border:1px solid var(--border);}
  .qr-grid i{background:transparent;}
  .qr-grid i.on{background:#141416;}
  .label-print-btn{width:100%; padding:10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:12.5px; min-height:42px;}
  #popoverBackdrop{position:fixed; inset:0; z-index:70; display:none;}
  #popoverBackdrop.open{display:block;}

  @media print{
    body *{visibility:hidden;}
    #labelPopover, #labelPopover *{visibility:visible;}
    #labelPopover{position:fixed; top:20px; left:20px; box-shadow:none; display:block;}
    .label-close{display:none;}
  }
</style>

<script>
(function(){
  "use strict";

  var SESSION_KEY = "counterRoomDemo_session_v4";
  var DEPARTMENTS = ["Merchandising", "Quality", "Production", "Other"];
  var SAMPLE_TYPES = ["PP Sample", "Initial Sample", "TOP Sample", "GOLD Seal"];
  var SEAL_COLORS = [{value:"green", label:"Green"}, {value:"red", label:"Red"}, {value:"white", label:"White"}];
  var currentUser = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function initials(name){ return String(name||"? ?").split(" ").map(function(p){return p[0]||"";}).join("").slice(0,2).toUpperCase(); }

  /* ================= data (server-backed — see /api/*) ================= */
  var samples = [];
  // Server sends dates as ISO strings; history timestamps need plain
  // millisecond numbers for the sort/relative-time math below, so that's
  // the one thing normalized right after every fetch.
  function normalizeSample(s){
    s.history = (s.history || []).map(function(h){
      var h2 = {};
      for (var k in h) h2[k] = h[k];
      h2.at = h.at ? new Date(h.at).getTime() : null;
      h2.expectedReturn = h.expectedReturn ? new Date(h.expectedReturn).getTime() : null;
      return h2;
    });
    return s;
  }
  async function refreshSamples(){
    var res = await fetch('/api/samples');
    if (!res.ok) throw new Error('Failed to load samples from the server');
    samples = (await res.json()).map(normalizeSample);
  }
  function byId(id){
    id = Number(id);
    for (var i=0;i<samples.length;i++){ if (samples[i].id===id) return samples[i]; }
    return null;
  }

  /* ================= time / labels ================= */
  function fmtMinutes(mins){
    var abs = Math.abs(mins);
    var d = Math.floor(abs/1440), h = Math.floor((abs%1440)/60), m = Math.round(abs%60);
    var parts=[];
    if (d>0) parts.push(d+"d");
    if (h>0) parts.push(h+"h");
    if (d===0 && m>0) parts.push(m+"m");
    if (parts.length===0) parts.push("0m");
    return parts.join(" ");
  }
  function dueInfo(dueAtStr){
    var mins = (new Date(dueAtStr).getTime() - Date.now())/60000;
    if (mins < 0) return {state:"critical", label: fmtMinutes(mins)+" overdue", mins:mins};
    if (mins <= 120) return {state:"warn", label:"due in "+fmtMinutes(mins), mins:mins};
    return {state:"ok", label:"due in "+fmtMinutes(mins), mins:mins};
  }
  function timeAgo(atMs){
    var mins = (Date.now() - atMs)/60000;
    if (mins < 1) return "just now";
    if (mins < 60) return Math.round(mins)+"m ago";
    if (mins < 1440) return Math.round(mins/60)+"h ago";
    return Math.round(mins/1440)+"d ago";
  }
  function fmtDT(atMs){
    return new Date(atMs).toLocaleString("en-IN", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  }
  function statusOf(s){
    if (s.status==="in-room") return "in-room";
    return dueInfo(s.dueAt).state==="critical" ? "overdue" : "issued";
  }

  /* ================= toast ================= */
  function toast(msg, kind, ms){
    var root = document.getElementById("toastRoot");
    if (!root) return;
    kind = kind || "info"; ms = ms || 2800;
    var el = document.createElement("div");
    el.className = "toast " + kind;
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.classList.add("show"); }, 10);
    setTimeout(function(){
      el.classList.remove("show");
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, ms);
  }

  /* ================= photo compression ================= */
  function readAndCompress(file, maxDim, quality){
    maxDim = maxDim || 1600; quality = quality || 0.92;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Could not read this file.")); };
      reader.onload = function(e){
        var img = new Image();
        img.onerror = function(){ reject(new Error("Could not read this image.")); };
        img.onload = function(){
          var w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim){
            if (w >= h){ h = Math.round(h*(maxDim/w)); w = maxDim; } else { w = Math.round(w*(maxDim/h)); h = maxDim; }
          }
          try{
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          }catch(err){ resolve(e.target.result); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // One shared hidden <input type=file>, reused by every "add photo(s)"
  // control. No `capture` attribute anywhere: on iOS Safari (including iOS 12)
  // that attribute has a history of silently doing nothing on iPad, so every
  // photo control here relies on the browser's own native picker instead
  // (which already offers "Take Photo" + "Photo Library" on iOS, and
  // "Camera" + "Files"/gallery on Android). `multiple` is toggled per-target
  // below: everything except the issue-time taker photo accepts several
  // photos at once.
  var hiddenPhotoInput = document.getElementById("hiddenPhotoInput");
  var photoTarget = null; // {kind:'log'|'samplePhotos'|'issue', id?}
  function pickPhoto(target){
    photoTarget = target;
    if (target.kind === "issue") hiddenPhotoInput.removeAttribute("multiple");
    else hiddenPhotoInput.setAttribute("multiple", "multiple");
    hiddenPhotoInput.click();
  }
  hiddenPhotoInput.addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = "";
    if (!files.length || !photoTarget) return;
    Promise.all(files.map(function(f){ return readAndCompress(f, 1600, 0.92); }))
      .then(function(dataUrls){ onPhotoReady(photoTarget, dataUrls); })
      .catch(function(err){ toast("Could not read photo: "+(err&&err.message?err.message:err), "error"); });
  });

  async function addPhotosToSample(id, dataUrls){
    try{
      var res = await fetch('/api/samples/'+id+'/photos', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({photos: dataUrls})
      });
      if (!res.ok) throw new Error('Could not upload photo(s).');
      var photos = await res.json();
      var s = byId(id); if (s) s.photos = photos;
      toast(dataUrls.length>1 ? "Photos added" : "Photo added", "success");
      renderView();
    }catch(err){ toast(err.message || "Could not upload photo(s).", "error"); }
  }
  async function doRemovePhoto(id, photoId){
    if (!confirm("Remove this photo?")) return;
    try{
      var res = await fetch('/api/samples/'+id+'/photos/'+photoId, {method:'DELETE'});
      if (!res.ok && res.status!==204) throw new Error('Could not remove photo.');
      var s = byId(id); if (s) s.photos = (s.photos||[]).filter(function(p){return p.id!==Number(photoId);});
      toast("Photo removed", "info");
      renderView();
    }catch(err){ toast(err.message || "Could not remove photo.", "error"); }

  /* ================= actions (all server-backed) ================= */
  async function doIssueConfirm(id){
    var s = byId(id); if (!s) return;
    var taker = document.getElementById("imTaker").value.trim();
    var dept = document.getElementById("imDept").value;
    var note = document.getElementById("imNote").value.trim();
    if (!taker || !state.issueDeadline){ toast("Enter who is taking it and pick a return deadline.", "error"); return; }
    var btn = document.querySelector('[data-issue-confirm="'+id+'"]');
    if (btn){ btn.disabled = true; btn.textContent = "Saving…"; }
    try{
      var res = await fetch('/api/samples/'+id+'/issue', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({holder:taker, dept:dept, dueAt:new Date(state.issueDeadline).toISOString(), note:note, takerPhoto: issuePhotoCache[id]||null})
      });
      if (!res.ok) throw new Error((await res.json().catch(function(){return {};})).error || 'Could not issue this sample.');
      var updated = normalizeSample(await res.json());
      var idx = samples.findIndex(function(x){return x.id===updated.id;});
      if (idx>=0) samples[idx]=updated; else samples.unshift(updated);
      delete issuePhotoCache[id];
      state.issueExpanded = null; state.issueDeadline = null;
      toast("Issued to " + taker, "success");
      renderView();
    }catch(err){
      toast(err.message || "Could not issue this sample.", "error");
      if (btn){ btn.disabled = false; btn.textContent = "Confirm hand-off"; }
    }
  }
  async function doReturn(id){
    var s = byId(id); if (!s) return;
    try{
      var res = await fetch('/api/samples/'+id+'/return', {method:'POST'});
      if (!res.ok) throw new Error((await res.json().catch(function(){return {};})).error || 'Could not mark as returned.');
      var updated = normalizeSample(await res.json());
      var idx = samples.findIndex(function(x){return x.id===id;});
      if (idx>=0) samples[idx] = updated;
      toast("Marked as returned", "success");
      if (state.masterExpanded === id) state.masterExpanded = null;
      renderView();
    }catch(err){ toast(err.message || "Could not mark as returned.", "error"); }
  }
  async function doLogSubmit(){
    var seal = document.getElementById("logSeal").value.trim().toUpperCase();
    var name = document.getElementById("logName").value.trim();
    if (!seal || !name){ toast("Seal number and sample name are required.", "error"); return; }
    if (samples.some(function(x){return x.seal===seal;})){ toast("A sample with seal number "+seal+" already exists.", "error"); return; }
    var btn = document.getElementById("logSubmitBtn");
    btn.disabled = true; btn.textContent = "Logging…";
    var payload = {
      seal: seal,
      color: document.getElementById("logColor").value,
      type: document.getElementById("logType").value,
      name: name,
      buyer: document.getElementById("logBuyer").value.trim(),
      po: document.getElementById("logPo").value.trim(),
      merchant: document.getElementById("logMerchant").value.trim(),
      item: document.getElementById("logItem").value.trim(),
      location: document.getElementById("logLoc").value.trim(),
      notes: document.getElementById("logNotes").value.trim(),
      loggedBy: currentUser.name,
      photos: state.logPhotos || []
    };
    try{
      var res = await fetch('/api/samples', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      if (!res.ok) throw new Error((await res.json().catch(function(){return {};})).error || 'Could not log this sample.');
      var created = normalizeSample(await res.json());
      samples.unshift(created);
      toast("Logged " + seal + " into the register", "success");
      state.logDraft = {color: SEAL_COLORS[0].value, type: SAMPLE_TYPES[0]};
      state.logPhotos = [];
      renderView();
    }catch(err){
      toast(err.message || "Could not log this sample.", "error");
    }finally{
      btn.disabled = false; btn.textContent = "Log sample into register";
    }
  }
  async function doEditSave(id){
    var s = byId(id); if (!s) return;
    var newSeal = document.getElementById("editSeal").value.trim().toUpperCase();
    var name = document.getElementById("editName").value.trim();
    if (!newSeal || !name){ toast("Seal number and sample name are required.", "error"); return; }
    if (newSeal !== s.seal && samples.some(function(x){return x.seal===newSeal;})){ toast("Seal number already in use.", "error"); return; }
    var payload = {
      seal: newSeal,
      color: document.getElementById("editColor").value,
      type: document.getElementById("editType").value,
      name: name,
      buyer: document.getElementById("editBuyer").value.trim(),
      po: document.getElementById("editPo").value.trim(),
      merchant: document.getElementById("editMerchant").value.trim(),
      item: document.getElementById("editItem").value.trim(),
      location: document.getElementById("editLoc").value.trim(),
      notes: document.getElementById("editNotes").value.trim()
    };
    var saveBtn = document.querySelector('[data-edit-save="'+id+'"]');
    if (saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "Saving…"; }
    try{
      var res = await fetch('/api/samples/'+id, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      if (!res.ok) throw new Error((await res.json().catch(function(){return {};})).error || 'Could not save changes.');
      var updated = normalizeSample(await res.json());
      var idx = samples.findIndex(function(x){return x.id===id;});
      if (idx>=0) samples[idx] = updated;
      state.masterEditing = false;
      state.masterExpanded = id;
      toast("Sample updated", "success");
      renderView();
    }catch(err){
      toast(err.message || "Could not save changes.", "error");
      if (saveBtn){ saveBtn.disabled = false; saveBtn.textContent = "Save changes"; }
    }
  }
  async function doDelete(id){
    id = Number(id);
    var s = byId(id); if (!s) return;
    if (!confirm('Delete "'+s.seal+'" permanently? This cannot be undone.')) return;
    try{
      var res = await fetch('/api/samples/'+id, {method:'DELETE'});
      if (!res.ok && res.status!==204) throw new Error('Could not delete this sample.');
      samples = samples.filter(function(x){ return x.id !== id; });
      state.masterExpanded = null; state.masterEditing = false;
      toast("Sample deleted", "info");
      renderView();
    }catch(err){ toast(err.message || "Could not delete this sample.", "error"); }
  }

  /* ================= label popover ================= */
  var popover = document.getElementById("labelPopover");
  var backdrop = document.getElementById("popoverBackdrop");
  function hash(str){ var h=0; for (var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
  function buildQr(seed){
    var h = hash(seed), cells = "";
    for (var i=0;i<81;i++){
      var col = i % 9, row = Math.floor(i/9);
      var finder = (col<3&&row<3)||(col>5&&row<3)||(col<3&&row>5);
      var on = finder ? (col===1&&row===1?false:(col===0||col===2||row===0||row===2||(col<3&&row<3))) : (((h >> (i%24)) & 1) === 1);
      cells += '<i class="'+(on?"on":"")+'"></i>';
    }
    return cells;
  }
  function openLabel(id, anchor){
    var s = byId(id); if (!s) return;
    document.getElementById("lpSeal").textContent = s.seal;
    document.getElementById("lpType").textContent = s.type + " · " + s.buyer;
    document.getElementById("qrGrid").innerHTML = buildQr(s.seal);
    var r = anchor.getBoundingClientRect();
    var top = Math.min(r.bottom + 8, window.innerHeight - 260);
    var left = Math.min(Math.max(8, r.left - 80), window.innerWidth - 230);
    popover.style.top = Math.max(8,top) + "px";
    popover.style.left = Math.max(8,left) + "px";
    popover.classList.add("open");
    backdrop.classList.add("open");
  }
  function closeLabel(){ popover.classList.remove("open"); backdrop.classList.remove("open"); }
  document.getElementById("lpClose").addEventListener("click", closeLabel);
  backdrop.addEventListener("click", closeLabel);
  document.getElementById("lpPrint").addEventListener("click", function(){ window.print(); });

  /* ================= photo lightbox (multi-photo gallery) ================= */
  var photoLightbox = document.getElementById("photoLightbox");
  var plImg = document.getElementById("plImg");
  var plCounter = document.getElementById("plCounter");
  var plPrev = document.getElementById("plPrev");
  var plNext = document.getElementById("plNext");
  var galleryPhotos = [];
  var galleryIndex = 0;
  function renderLightbox(){
    if (!galleryPhotos.length) return;
    plImg.src = galleryPhotos[galleryIndex].url;
    var multi = galleryPhotos.length > 1;
    plPrev.style.display = multi ? "flex" : "none";
    plNext.style.display = multi ? "flex" : "none";
    plCounter.style.display = multi ? "block" : "none";
    plCounter.textContent = (galleryIndex+1) + " / " + galleryPhotos.length;
  }
  function openPhotoView(photos, index){
    galleryPhotos = photos || [];
    if (!galleryPhotos.length) return;
    galleryIndex = Math.max(0, Math.min(index||0, galleryPhotos.length-1));
    renderLightbox();
    photoLightbox.classList.add("open");
  }
  function closePhotoView(){ photoLightbox.classList.remove("open"); plImg.src = ""; galleryPhotos = []; }
  function photoViewPrev(){ if (galleryPhotos.length<2) return; galleryIndex = (galleryIndex - 1 + galleryPhotos.length) % galleryPhotos.length; renderLightbox(); }
  function photoViewNext(){ if (galleryPhotos.length<2) return; galleryIndex = (galleryIndex + 1) % galleryPhotos.length; renderLightbox(); }
  document.getElementById("plClose").addEventListener("click", closePhotoView);
  plPrev.addEventListener("click", photoViewPrev);
  plNext.addEventListener("click", photoViewNext);
  photoLightbox.addEventListener("click", function(e){ if (e.target === photoLightbox) closePhotoView(); });
  document.addEventListener("keydown", function(e){
    if (e.key==="Escape"){ closeLabel(); closePhotoView(); }
    if (photoLightbox.classList.contains("open")){
      if (e.key==="ArrowLeft") photoViewPrev();
      if (e.key==="ArrowRight") photoViewNext();
    }
  });

    if (photoRemoveBtn){ doRemovePhoto(photoRemoveBtn.getAttribute("data-photo-remove"), photoRemoveBtn.getAttribute("data-photo-remove-id")); return; }

    var photoViewOpen = e.target.closest("[data-photo-view-open]");
    if (photoViewOpen){
      var samp = byId(photoViewOpen.getAttribute("data-photo-view-open"));

      return;
    }
    var navBtn = e.target.closest("[data-nav]");
    if (navBtn && currentUser){
      var opts = navBtn.getAttribute("data-nav-filter") ? {masterFilter: navBtn.getAttribute("data-nav-filter")} : null;
      navigate(navBtn.getAttribute("data-nav"), opts);
      return;
    }
    var toggleMaster = e.target.closest("[data-toggle-master]");
    if (toggleMaster){
      var id1 = Number(toggleMaster.getAttribute("data-toggle-master"));
      state.masterEditing = false;
      state.masterExpanded = (state.masterExpanded===id1) ? null : id1;
      renderView(); return;
    }
    var toggleIssue = e.target.closest("[data-toggle-issue]");
    if (toggleIssue){
      var id2 = Number(toggleIssue.getAttribute("data-toggle-issue"));
      state.issueDeadline = null;
      state.issueExpanded = (state.issueExpanded===id2) ? null : id2;
      renderView(); return;
    }
    var issueCancel = e.target.closest("[data-issue-cancel]");
    if (issueCancel){ state.issueExpanded = null; state.issueDeadline = null; renderView(); return; }
    var deadlineBtn = e.target.closest("[data-deadline]");
    if (deadlineBtn){ state.issueDeadline = Number(deadlineBtn.getAttribute("data-deadline")); renderView(); return; }
    var issueConfirmBtn = e.target.closest("[data-issue-confirm]");
    if (issueConfirmBtn){ doIssueConfirm(issueConfirmBtn.getAttribute("data-issue-confirm")); return; }
    var issuePhotoBtn = e.target.closest("[data-photo-issue]");
    if (issuePhotoBtn){ pickPhoto({kind:"issue", id:issuePhotoBtn.getAttribute("data-photo-issue")}); return; }
    var issueFromMaster = e.target.closest("[data-issue-from-master]");
    if (issueFromMaster){ var id3 = Number(issueFromMaster.getAttribute("data-issue-from-master")); state.masterExpanded = null; state.issueExpanded = id3; state.issueDeadline = null; navigate("issue"); return; }
    var returnBtn = e.target.closest("[data-return]");
    if (returnBtn){ doReturn(returnBtn.getAttribute("data-return")); return; }
    var labelBtn = e.target.closest("[data-label]");
    if (labelBtn){ openLabel(labelBtn.getAttribute("data-label"), labelBtn); return; }
    var editStart = e.target.closest("[data-edit-start]");
    if (editStart){ state.masterEditing = true; renderView(); return; }
    var editCancel = e.target.closest("[data-edit-cancel]");
    if (editCancel){ state.masterEditing = false; renderView(); return; }
    var editSave = e.target.closest("[data-edit-save]");
    if (editSave){ doEditSave(editSave.getAttribute("data-edit-save")); return; }
    var deleteBtn = e.target.closest("[data-delete]");
    if (deleteBtn){ doDelete(deleteBtn.getAttribute("data-delete")); return; }
    var masterChip = e.target.closest("[data-master-filter]");
    if (masterChip){ state.masterFilter = masterChip.getAttribute("data-master-filter"); renderView(); return; }
    var logPhotoBtn = e.target.closest("#logPhotoBtn");
    if (logPhotoBtn){ pickPhoto({kind:"log"}); return; }
    var logPhotoRemove = e.target.closest("[data-log-photo-remove]");
    if (logPhotoRemove){ state.logPhotos.splice(Number(logPhotoRemove.getAttribute("data-log-photo-remove")), 1); renderView(); return; }
    var logSubmitBtn = e.target.closest("#logSubmitBtn");
    if (logSubmitBtn){ doLogSubmit(); return; }
  });

  document.body.addEventListener("input", function(e){

    else if (e.target.id === "issueSearch"){ state.issueQuery = e.target.value.trim().toLowerCase(); rerenderListOnly("issue"); }

  // Re-render just the list below a search box without rebuilding the input
  // itself (which would steal focus on iOS mid-keystroke).
  function rerenderListOnly(view){
    var root = document.getElementById("viewRoot");
    var wrap = root.querySelector("div:last-child");
    if (view==="master" && wrap){
      var rows = samples.filter(matchesMaster);
      wrap.innerHTML = rows.length ? rows.map(masterCardHtml).join("") : '<p class="empty-note">No samples match. Try clearing the search or filter.</p>';
    } else if (view==="issue" && wrap){
      var rows2 = samples.filter(matchesIssue);
      wrap.innerHTML = rows2.length ? rows2.map(issueCardHtml).join("") : '<p class="empty-note">Nothing in the room to issue right now.</p>';
    } else if (view==="return" && wrap){
      var rows3 = samples.filter(matchesReturn).sort(function(a,b){ return dueInfo(a.dueAt).mins - dueInfo(b.dueAt).mins; });
      wrap.innerHTML = rows3.length ? rows3.map(returnCardHtml).join("") : '<p class="empty-note">Nothing checked out right now.</p>';
    }
  }

  /* ================= clock ================= */
  function tick(){
    var d = new Date();
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }
  tick(); setInterval(tick, 1000);

  /* ================= live-ish sync =================
     This app now shares one server-side database across every device on
     the network, so periodically pull fresh data — skipped while a form
     is actively being filled in or a search box has focus, so nobody's
     typing gets clobbered mid-keystroke. */
  var livePollTimer = null;
  function startLivePolling(){
    if (livePollTimer) return;
    livePollTimer = setInterval(async function(){
      if (!currentUser) return;
      if (state.masterEditing || state.issueExpanded!=null) return;
      var active = document.activeElement;
      if (active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")) return;
      try{ await refreshSamples(); renderView(); }catch(err){ /* stay quiet — next tick retries */ }
    }, 20000);
  }
  function stopLivePolling(){ if (livePollTimer){ clearInterval(livePollTimer); livePollTimer = null; } }

  /* ================= login / logout ================= */
  async function enterApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appShell").style.display = "block";
    document.getElementById("userChip").innerHTML =
      '<span class="avatar">'+esc(initials(currentUser.name))+'</span>' +
      '<span><div class="u-name">'+esc(currentUser.name)+'</div><div class="u-role">'+(currentUser.role==="admin"?"Admin":"Employee")+'</div></span>';
    state.view = "dashboard";
    try{ await refreshSamples(); }catch(err){ toast("Could not load data from the server.", "error"); }
    renderShell();
    startLivePolling();
  }
  function doLogout(){
    try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
    currentUser = null;
    stopLivePolling();
    document.getElementById("appShell").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("loginId").value = "";
    document.getElementById("loginPwd").value = "";
    document.getElementById("loginErr").textContent = "";
  }
  document.getElementById("logoutBtn").addEventListener("click", doLogout);
  document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var idVal = document.getElementById("loginId").value.trim().toLowerCase();
    var pwdVal = document.getElementById("loginPwd").value;
    var errEl = document.getElementById("loginErr");
    var btn = document.querySelector(".login-submit");
    btn.disabled = true; btn.textContent = "Signing in…";
    try{
      var res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:idVal, pwd:pwdVal})});
      if (!res.ok){
        var body = await res.json().catch(function(){return {};});
        errEl.textContent = body.error || "Incorrect user ID or password.";
        return;
      }
      var acct = await res.json();
      errEl.textContent = "";
      currentUser = acct;
      try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(acct)); }catch(e2){}
      await enterApp();
    }catch(err){
      errEl.textContent = "Could not reach the server. Check your connection and try again.";
    }finally{
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  /* ================= boot ================= */
  (async function boot(){
    try{
      var lookups = await fetch('/api/lookups').then(function(r){ return r.json(); });
      if (lookups.sealColors && lookups.sealColors.length) SEAL_COLORS = lookups.sealColors;
      if (lookups.sampleTypes && lookups.sampleTypes.length) SAMPLE_TYPES = lookups.sampleTypes;
      if (lookups.departments && lookups.departments.length) DEPARTMENTS = lookups.departments;
    }catch(err){ /* keep the built-in fallback lists above */ }
    state.logDraft = {color: SEAL_COLORS[0].value, type: SAMPLE_TYPES[0]};

    try{
      var raw = sessionStorage.getItem(SESSION_KEY);
      if (raw){
        var acct = JSON.parse(raw);
        if (acct && acct.id){ currentUser = acct; await enterApp(); }
      }
    }catch(e){}
  })();
})();
</script>
